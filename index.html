<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0B12" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="icon" href="logo.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icon-192.png" />
    <title>Chromira</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="mute" aria-label="Mute" aria-pressed="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 9h4l5-4v14l-5-4H4z" />
        <path class="on" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" />
        <path class="off" d="M17 9l5 6M22 9l-5 6" />
      </svg>
    </button>
    <button id="menu-btn" aria-label="Menu" aria-expanded="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M5 7h14M5 12h14M5 17h14" />
      </svg>
    </button>
    <div id="mini" hidden>
      <nav class="panel" id="mini-panel">
        <button data-go="home">Home</button>
        <button data-go="levels">Levels</button>
      </nav>
      <form class="panel" id="dev-panel" hidden autocomplete="off">
        <input type="password" placeholder="Password" aria-label="Developer password" />
        <p class="dev-msg" aria-live="polite"></p>
        <button type="submit"></button>
        <button type="button" class="dev-back">Back</button>
      </form>
    </div>

    <section id="home" class="screen">
      <div class="home-inner">
        <div class="logo" id="logo" aria-hidden="true"></div>
        <h1 class="title">CHROMIRA</h1>
        <p class="tagline">guide the light</p>
        <button class="big" id="play"><span class="play-main">Play</span><span id="play-sub"></span></button>
        <button class="big ghost" data-go="levels">Levels</button>
      </div>
    </section>

    <section id="levels" class="screen" hidden>
      <header>
        <button class="icon" data-go="back" aria-label="Back">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <h2>Levels</h2>
        <span class="progress" id="progress"></span>
      </header>
      <div class="grid" id="grid"></div>
    </section>

    <div id="rotate" aria-live="polite">
      <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="16" y="6" width="16" height="28" rx="3" />
        <path d="M22 30h4" />
        <path d="M8 34a16 16 0 0 0 14 8M40 14a16 16 0 0 0-14-8" />
        <path d="M22 38l0 4 4 0M26 10l0-4-4 0" />
      </svg>
      <p>Rotate your device</p>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
